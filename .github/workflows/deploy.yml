name: Deploy to production

# Deploys on every push to master by SSHing into the production server,
# pulling this repository, and running the Laravel post-deploy commands.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST  - server hostname or IP
#   DEPLOY_USER  - SSH username
#   DEPLOY_KEY   - private SSH key whose public half is in the server's
#                  ~/.ssh/authorized_keys
#   DEPLOY_PATH  - absolute path of the Laravel app on the server
# Optional:
#   DEPLOY_PORT  - SSH port (defaults to 22)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull https://github.com/AbbysolaA/Aethryna.git master
            composer install --no-dev --no-interaction --prefer-dist
            php artisan migrate --force
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
